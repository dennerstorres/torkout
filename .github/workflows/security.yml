name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:scan
      - run: pnpm audit --prod --audit-level high

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        run: |
          docker build -f apps/api/Dockerfile -t torkout-api:ci .
          docker build -f apps/web/Dockerfile -t torkout-web:ci .
          mkdir -p "$RUNNER_TEMP/torkout-images"
          docker save -o "$RUNNER_TEMP/torkout-images/api.tar" torkout-api:ci
          docker save -o "$RUNNER_TEMP/torkout-images/web.tar" torkout-web:ci
      - name: Scan API image
        run: docker run --rm -v "$RUNNER_TEMP/torkout-images:/scan:ro" aquasec/trivy:0.72.0 image --input /scan/api.tar --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --scanners vuln
      - name: Scan web image
        run: docker run --rm -v "$RUNNER_TEMP/torkout-images:/scan:ro" aquasec/trivy:0.72.0 image --input /scan/web.tar --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --scanners vuln
