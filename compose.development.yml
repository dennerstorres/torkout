name: torkout-development

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: torkout
      POSTGRES_PASSWORD: torkout_dev_only
      POSTGRES_USER: torkout
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U torkout -d torkout']
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - '55433:5432'
    volumes:
      - postgres-development-data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-development-data:
