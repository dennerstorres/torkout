services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: torkout_test
      POSTGRES_PASSWORD: torkout_test
      POSTGRES_USER: torkout_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U torkout_test -d torkout_test']
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      # 15432 e não 55432: o Windows reserva faixas altas de porta efêmera (55367–55466 nesta
      # máquina), e o bind falhava com "socket access forbidden" antes de o contêiner subir.
      - '15432:5432'
    tmpfs:
      - /var/lib/postgresql
