services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: torkout_test
      POSTGRES_PASSWORD: torkout_test
      POSTGRES_USER: torkout_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U torkout_test -d torkout_test']
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - '55432:5432'
    tmpfs:
      - /var/lib/postgresql
