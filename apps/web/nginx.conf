server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 ipv6=off valid=30s;

  # Os cabeçalhos de segurança ficam em `security-headers.conf` e são incluídos apenas onde o nginx
  # serve o próprio conteúdo. No bloco `server` eles seriam herdados também pelas `location` de
  # proxy e acrescentados às respostas da API, que define os seus — e os define de forma mais
  # completa. A duplicação não era só redundante: o `Referrer-Policy: no-referrer` daqui vencia o
  # `same-origin` que a tela de consentimento declara de propósito, e o navegador passava a enviar
  # `Origin: null` no formulário, que o próprio servidor então recusava.

  location = /health/live {
    include /etc/nginx/security-headers.conf;
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location ~ ^/(api|auth)/ {
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  # Integração MCP somente leitura e o servidor OAuth que a protege. Só respondem quando a API sobe
  # com MCP_ENABLED=true; caso contrário, a própria API devolve 404.
  # O transporte MCP pode manter a resposta aberta enquanto a ferramenta executa, então o buffer é
  # desligado e o tempo de leitura é maior que o padrão de 60 s.
  location ~ ^/(mcp|oauth/|\.well-known/oauth-) {
    set $mcp_upstream api:3000;
    proxy_pass http://$mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location = /sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
