# Cabeçalhos de segurança do aplicativo estático.
#
# Este arquivo é incluído por cada `location` que serve conteúdo do próprio nginx, e por nenhuma que
# repasse para a API. As respostas da API carregam os cabeçalhos que ela mesma define — mais
# completos que estes, e às vezes deliberadamente diferentes: a tela de consentimento OAuth precisa
# de `Referrer-Policy: same-origin` para que o formulário não saia com `Origin: null`.
#
# Fica fora de `/etc/nginx/conf.d/`, que é incluído automaticamente dentro de `http` e faria estes
# cabeçalhos valerem para tudo de novo.

add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; manifest-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'" always;
